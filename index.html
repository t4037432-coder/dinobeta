<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hardtekk LOL System - Final</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: 'Segoe UI', sans-serif; text-align: center; padding-top: 50px; }
        #content { max-height: 400px; overflow-y: auto; margin: 20px auto; width: 50%; border: 1px solid #444; padding: 15px; background: #1a1a1a; text-align: left; }
        button { padding: 15px 30px; font-size: 20px; background-color: #e84118; color: white; border: none; border-radius: 8px; cursor: pointer; }
        button:hover { background-color: #c23616; }
        #status { color: #fbc531; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h1 id="status">Nhấn "Khởi động hệ thống" để bắt đầu</h1>
    
    <!-- File nhạc mới ww.mp3 -->
    <audio id="bgMusic" src="ww.mp3"></audio>
    
    <button onclick="startSystem()">Khởi động hệ thống</button>
    <div id="content"></div>

    <script>
        const statusText = document.getElementById('status');
        const contentDiv = document.getElementById('content');
        const audio = document.getElementById('bgMusic');
        let hasStarted = false;
        let isTriggered = false;

        function startSystem() {
            if (hasStarted) return;
            hasStarted = true;
            
            audio.play().then(() => {
                statusText.innerText = "🎵 Nhạc đang chạy... Chờ 20 giây đầu.";
            }).catch(e => {
                statusText.innerText = "⚠️ Lỗi: Không thể phát ww.mp3. Kiểm tra file!";
                hasStarted = false;
            });

            audio.addEventListener('timeupdate', function checkTime() {
                if (audio.currentTime >= 20 && !isTriggered) {
                    isTriggered = true;
                    statusText.innerText = "🚀 Đã đạt 20 giây: Kích hoạt 10 LOL/s!";
                    
                    // In 10 chữ LOL mỗi giây (100ms/lần)
                    setInterval(() => {
                        let p = document.createElement('p');
                        p.innerText = "LOL";
                        contentDiv.appendChild(p);
                        contentDiv.scrollTop = contentDiv.scrollHeight;
                    }, 100);
                }
            });
        }
    </script>
</body>
</html>
