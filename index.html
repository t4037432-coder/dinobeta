<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrome Dino Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            /* Đổi nền sang màu trắng giống hệt hình ảnh của bạn */
            background-color: #ffffff; 
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            font-size: 20px;
            color: #333;
            margin-bottom: 10px;
            font-weight: normal;
        }
        canvas {
            display: block;
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <h1>Chrome Dino Game</h1>
    <!-- Game sẽ tự gắn vào thẻ canvas này -->
    <canvas id="canvas"></canvas>

    <!-- Nhớ dán toàn bộ mã JavaScript vào file script.js nằm cùng thư mục -->
    <script src="script.js"></script>
</body>
</html>
