<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hardtekk LOL System - Protected</title>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; text-align: center; padding-top: 30px; user-select: none; }
        
        /* Thanh tiến trình hiển thị nhạc đang chạy đến đâu */
        #progressBarContainer {
            width: 60%;
            height: 12px;
            background: #222;
            border: 2px solid #ff4757;
            margin: 15px auto;
            border-radius: 6px;
            overflow: hidden;
        }
        #progressBar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff4757, #fbc531);
            transition: width 0.1s linear;
        }

        #timeDisplay { font-size: 16px; color: #fbc531; margin-bottom: 10px; font-weight: bold; }

        #content { height: 300px; overflow-y: auto; margin: 15px auto; width: 60%; border: 2px solid #ff4757; padding: 15px; background: #111; text-align: left; }
        
        .lol-line { color: #555; font-size: 16px; transition: color 0.2s ease; }
        .lol-line.active { color: #fbc531; font-size: 20px; font-weight: bold; text-shadow: 0 0 10px #fbc531; }

        button { padding: 15px 30px; font-size: 18px; background-color: #ff4757; color: white; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; }
        
        #lockScreen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 999;
            padding-top: 150px;
        }
    </style>
</head>
<body>

    <h1 id="status">Nhấn "BẮT ĐẦU" để chạy hệ thống</h1>
    
    <!-- Thanh tiến trình & đồng hồ thời gian -->
    <div id="timeDisplay">00:00 / 03:45</div>
    <div id="progressBarContainer">
        <div id="progressBar"></div>
    </div>

    <audio id="bgMusic" src="https://github.com/t4037432-coder/12345LOL.ez/raw/main/ww.mp3"></audio>
    
    <br>
    <button id="startBtn" onclick="startSystem()">BẮT ĐẦU</button>
    <button id="stopBtn" onclick="stopSystem()" style="background-color: #57606f; display: none;">STOP</button>
    
    <div id="content"></div>

    <div id="lockScreen">
        <h1 style="color: #ff4757;">BẠN ĐÃ DỪNG HỆ THỐNG!</h1>
        <h2>Vui lòng chờ phạt: <span id="countdown">60</span> giây</h2>
    </div>

    <script>
        // VÔ HIỆU HÓA CHUỘT PHẢI VÀ F12 ĐỂ CHẶN KIỂM TRA MÃ NGUỒN
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', event => {
            if (
                event.key === 'F12' || 
                (event.ctrlKey && event.shiftKey && (event.key === 'I' || event.key === 'J' || event.key === 'C')) || 
                (event.ctrlKey && event.key === 'U')
            ) {
                event.preventDefault();
                alert('Tính năng này đã bị khóa!');
            }
        });

        const audio = document.getElementById('bgMusic');
        const contentDiv = document.getElementById('content');
        const statusText = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const lockScreen = document.getElementById('lockScreen');
        const countdownSpan = document.getElementById('countdown');
        const progressBar = document.getElementById('progressBar');
        const timeDisplay = document.getElementById('timeDisplay');
        
        let intervalId = null;
        let allLines = [];

        function startSystem() {
            startBtn.style.display = 'none';
            stopBtn.style.display = 'inline-block';
            audio.play();
            statusText.innerText = "Hệ thống đang chạy...";
        }

        // Định dạng thời gian (giây -> mm:ss)
        function formatTime(seconds) {
            let m = Math.floor(seconds / 60);
            let s = Math.floor(seconds % 60);
            return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
        }

        audio.addEventListener('timeupdate', () => {
            // Giới hạn trong khoảng 0:00 - 3:45 (225 giây) thì lặp lại
            if (audio.currentTime >= 225) {
                audio.currentTime = 0;
                audio.play();
            }

            // Cập nhật thanh tiến trình và đồng hồ trực quan
            let percent = (audio.currentTime / 225) * 100;
            progressBar.style.width = percent + "%";
            timeDisplay.innerText = formatTime(audio.currentTime) + " / 03:45";

            // Mốc 20 giây: Xả 50 LOL/s
            if (audio.currentTime >= 20 && !intervalId) {
                statusText.innerText = "ĐANG XẢ 50 LOL/s & CHẠY HIỆU ỨNG KARAOKE!";
                intervalId = setInterval(() => {
                    for(let i = 0; i < 5; i++) {
                        let p = document.createElement('p');
                        p.className = 'lol-line';
                        p.innerText = "LOL - Hardtekk System Running...";
                        contentDiv.appendChild(p);
                        allLines.push(p);
                    }
                    contentDiv.scrollTop = contentDiv.scrollHeight;
                }, 100);
            }

            // Hiệu ứng karaoke theo dòng chữ
            if (allLines.length > 0) {
                let progressRatio = audio.currentTime / 225;
                let activeIndex = Math.floor(progressRatio * allLines.length);

                allLines.forEach((line, index) => {
                    if (index === activeIndex) {
                        line.classList.add('active');
                        line.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    } else {
                        line.classList.remove('active');
                    }
                });
            }
        });

        function stopSystem() {
            audio.pause();
            clearInterval(intervalId);
            
            lockScreen.style.display = 'block';
            let timeLeft = 60;
            
            let timer = setInterval(() => {
                timeLeft--;
                countdownSpan.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    lockScreen.style.display = 'none';
                    startBtn.style.display = 'inline-block';
                    stopBtn.style.display = 'none';
                    audio.currentTime = 0;
                    statusText.innerText = "Nhấn 'BẮT ĐẦU' để chạy lại hệ thống";
                }
            }, 1000);
        }
    </script>
</body>
</html>
