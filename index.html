<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Test Nhạc và In LOL</title>
</head>
<body>
    <h1 id="status">Vui lòng bấm nút để bắt đầu...</h1>
    <!-- Thay 'link_nhac_cua_ban.mp3' bằng link file nhạc thực tế của bạn -->
    <audio id="myAudio" src="LINK_NHAC_CUA_BAN.mp3"></audio>
    <button onclick="startSystem()">Bắt đầu hệ thống</button>
    <div id="content"></div>

    <script>
        const statusText = document.getElementById('status');
        const contentDiv = document.getElementById('content');
        const audio = document.getElementById('myAudio');
        let hasStarted = false;

        function startSystem() {
            if (hasStarted) return;
            hasStarted = true;
            audio.play();
            statusText.innerText = "Đang phát nhạc (20 giây chờ)...";

            audio.addEventListener('timeupdate', () => {
                // Kiểm tra nếu nhạc đã chạy được 20 giây
                if (audio.currentTime >= 20) {
                    statusText.innerText = "have fun LOL";
                    
                    // Xóa event listener để tránh chạy hàm này liên tục
                    audio.removeEventListener('timeupdate', arguments.callee);

                    // Thiết lập bộ đếm 100ms = 10 lần/giây
                    setInterval(() => {
                        let p = document.createElement('p');
                        p.innerText = "LOL";
                        contentDiv.appendChild(p);
                    }, 100);
                }
            });
        }
    </script>
</body>
</html>
