<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hardtekk LOL System - Advanced</title>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; text-align: center; padding-top: 50px; }
        #content { height: 400px; overflow-y: auto; margin: 20px auto; width: 60%; border: 2px solid #ff4757; padding: 15px; background: #111; text-align: left; }
        button { padding: 15px 30px; font-size: 18px; background-color: #ff4757; color: white; border: none; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>

    <h1 id="status">Nhấn "BẮT ĐẦU" để chạy hệ thống</h1>
    <audio id="bgMusic" src="https://github.com/t4037432-coder/12345LOL.ez/raw/main/ww.mp3"></audio>
    
    <button id="startBtn" onclick="startSystem()">BẮT ĐẦU</button>
    <button id="stopBtn" onclick="stopSystem()" style="background-color: #57606f; display: none;">STOP</button>
    
    <div id="content"></div>

    <script>
        const audio = document.getElementById('bgMusic');
        const contentDiv = document.getElementById('content');
        const statusText = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        let intervalId = null;

        function startSystem() {
            startBtn.style.display = 'none';
            stopBtn.style.display = 'inline-block';
            audio.play();
            statusText.innerText = "Hệ thống đang chạy...";
        }

        // Tự động lặp và xử lý thời gian
        audio.addEventListener('timeupdate', () => {
            // Giới hạn trong khoảng 0:00 - 3:45 (225 giây)
            if (audio.currentTime >= 225) {
                audio.currentTime = 0;
                audio.play();
            }

            // Kích hoạt in LOL sau 20 giây
            if (audio.currentTime >= 20 && !intervalId) {
                statusText.innerText = "ĐANG XẢ 50 LOL/s !";
                intervalId = setInterval(() => {
                    for(let i=0; i<5; i++) { // In 50 cái mỗi giây = 5 cái mỗi 100ms
                        let p = document.createElement('p');
                        p.innerText = "LOL";
                        contentDiv.appendChild(p);
                    }
                    contentDiv.scrollTop = contentDiv.scrollHeight;
                }, 100);
            }
        });

        function stopSystem() {
            audio.pause();
            clearInterval(intervalId);
            
            // "Đá" người dùng ra khỏi web trong 1 phút
            document.body.innerHTML = "<h1>BẠN ĐÃ DỪNG HỆ THỐNG. HẸN GẶP LẠI SAU 60 GIÂY!</h1>";
            
            setTimeout(() => {
                location.reload(); // Tải lại trang sau 1 phút
            }, 60000);
        }
    </script>
</body>
</html>
