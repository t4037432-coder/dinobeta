<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hardtekk LOL System</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: sans-serif; text-align: center; padding-top: 40px; }
        #content { max-height: 350px; overflow-y: auto; margin: 20px auto; width: 60%; border: 1px solid #444; padding: 15px; background: #1a1a1a; text-align: left; }
        audio { margin: 20px 0; width: 300px; }
        #status { color: #fbc531; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

    <h1 id="status">Hãy nhấn Play trên thanh nhạc dưới đây để bắt đầu!</h1>
    
    <!-- Đã cập nhật link Raw chuẩn từ GitHub của bạn -->
    <audio id="bgMusic" src="https://github.com/t4037432-coder/12345LOL.ez/raw/main/ww.mp3" controls></audio>
    
    <div id="content"></div>

    <script>
        const statusText = document.getElementById('status');
        const contentDiv = document.getElementById('content');
        const audio = document.getElementById('bgMusic');
        let isTriggered = false;

        audio.addEventListener('play', () => {
            statusText.innerText = "🎵 Nhạc đang chạy... Tự động in LOL sau mốc 20 giây!";
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.currentTime >= 20 && !isTriggered) {
                isTriggered = true;
                statusText.innerText = "🔥 Đã qua 20 giây: Hệ thống đang xả 10 LOL/s!";
                
                // In 10 chữ LOL mỗi giây (100ms = 0.1s / lần)
                setInterval(() => {
                    let p = document.createElement('p');
                    p.innerText = "LOL";
                    contentDiv.appendChild(p);
                    contentDiv.scrollTop = contentDiv.scrollHeight;
                }, 100);
            }
        });
    </script>
</body>
</html>
