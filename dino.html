<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chrome Dino Game - Dynamic Speed Edition</title>
    <style>
        body {
            margin: 0;
            background: #f7f7f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            transition: background 0.3s;
        }
        h2 {
            color: #535353;
            margin-bottom: 15px;
        }
        canvas {
            background: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: filter 0.5s ease;
        }
        canvas.night {
            filter: invert(1) hue-rotate(180deg);
        }
    </style>
</head>
<body>

    <h2>Chrome Dino Game</h2>
    <canvas id="gameCanvas" width="800" height="250"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Game variables
        let score = 0;
        let highscore = 0;
        let baseSpeed = 6;
        let gameSpeed = 6;
        let isGameOver = false;
        let isGameStarted = false; 
        let frameCount = 0;
        let spawnTimer = 80; 

        // Restart delay management (0.5s)
        let canRestart = false;

        // AFK Mode
        let isAFK = false;

        // Rainbow box cycle: 60s -> 80s -> 45s
        const boxIntervals = [60, 80, 45];
        let currentBoxCycle = 0;
        let lastBoxTime = 0;

        // Skill variables
        let dinoRainbowTimer = 0;    // 900 frames (R Skill)
        let dinoSizeTimer = 0;       // 10s = 600 frames (Y Skill - Giant)
        let blinkCounter = 0;        // Counter for 5 blinks
        let blinkFrame = 0;          // Frame counter for blink timing
        let subTextEffects = [];     // +1 sub effect
        let levitateTimer = 0;       // 15s = 900 frames
        let fireworks = [];          // Fireworks particles

        // Entities
        let obstacles = [];
        let mysteryBoxes = [];
        let clouds = [];

        // Text effects
        let activeBonusText = null;  // For 'U' key cheat (+100)
        let thousandEffects = [];    // For Mystery Box (+1000)

        // Dino Object
        let dino = {
            x: 50,
            y: 175,
            width: 40,
            height: 43,
            vy: 0,
            gravity: 0.6,
            jumpForce: -11.5,
            grounded: true,
            ducking: false
        };

        function setDucking(isDucking) {
            if (dino.ducking === isDucking) return;
            dino.ducking = isDucking;
        }

        // Keyboard inputs
        window.addEventListener("keydown", function(e) {
            if (e.code === "Space" || e.code === "ArrowUp") {
                e.preventDefault(); 
                if (!isGameStarted) {
                    isGameStarted = true;
                    lastBoxTime = Date.now();
                    loop(); 
                } else if (dino.grounded && !isGameOver && !isAFK) {
                    setDucking(false);
                    dino.vy = dino.jumpForce;
                    dino.grounded = false;
                } else if (isGameOver && canRestart) {
                    resetGame();
                }
            }
            if (e.code === "ArrowDown") {
                e.preventDefault();
                if (isGameStarted && !isGameOver && !isAFK) {
                    if (!dino.grounded) {
                        dino.vy += 4; 
                    } else {
                        setDucking(true);
                    }
                }
            }
            // Toggle AFK Mode (Press A)
            if (e.key === "a" || e.key === "A") {
                isAFK = !isAFK;
                if (!isGameStarted) {
                    isGameStarted = true;
                    lastBoxTime = Date.now();
                    loop();
                }
            }
            
            // R Key Skill: Google Space Levitation + Vacuum Sucking up to 13 obstacles + 900f Rainbow
            if ((e.key === "r" || e.key === "R") && isGameStarted && !isGameOver) {
                dinoRainbowTimer = 900; // 900 frames Rainbow
                
                subTextEffects.push({
                    x: dino.x + 20,
                    y: dino.y - 35,
                    timer: 120
                });

                levitateTimer = 900; // 15 seconds

                let currentFloating = obstacles.filter(o => o.floating).length;
                for (let obs of obstacles) {
                    if (!obs.floating && currentFloating < 13) {
                        makeObstacleGoogleSpace(obs);
                        currentFloating++;
                    }
                }
            }

            // Y Key Skill: Giant 1.5x Size + Blink 5 times
            if ((e.key === "y" || e.key === "Y") && isGameStarted && !isGameOver) {
                dinoSizeTimer = 600; // 10 seconds total duration
                blinkCounter = 10;   // 10 state changes = 5 blinks (on/off)
                blinkFrame = 0;      // Reset blink timing
            }

            // Cheat Key U (+100 points)
            if ((e.key === "u" || e.key === "U") && isGameStarted && !isGameOver) {
                score += 100;

                if (!activeBonusText) {
                    activeBonusText = {
                        amount: 100,
                        timer: 120, 
                        x: dino.x + 20,
                        y: dino.y - 25
                    };
                } else {
                    activeBonusText.amount += 100;
                    activeBonusText.timer = Math.min(activeBonusText.timer + 60, 300);
                    activeBonusText.x = dino.x + 20;
                    activeBonusText.y = dino.y - 25;
                }
            }
        });

        window.addEventListener("keyup", function(e) {
            if (e.code === "ArrowDown" && !isAFK) {
                setDucking(false);
            }
        });

        function makeObstacleGoogleSpace(obs) {
            obs.floating = true;
            obs.noDamage = true;
            obs.vx = (Math.random() - 0.5) * 6;
            obs.vy = -Math.random() * 4 - 2;
            obs.angle = 0;
            obs.vRot = (Math.random() - 0.5) * 0.08;
        }

        function resetGame() {
            score = 0;
            gameSpeed = baseSpeed;
            obstacles = [];
            mysteryBoxes = [];
            clouds = [];
            thousandEffects = [];
            subTextEffects = [];
            fireworks = [];
            activeBonusText = null;
            isGameOver = false;
            canRestart = false;
            dinoRainbowTimer = 0;
            dinoSizeTimer = 0;
            blinkCounter = 0;
            levitateTimer = 0;
            setDucking(false);
            dino.y = 175;
            dino.vy = 0;
            dino.grounded = true;
            spawnTimer = 80; 
            lastBoxTime = Date.now();
            currentBoxCycle = 0;
            canvas.classList.remove("night");
            loop();
        }

        function spawnEntity() {
            let rand = Math.random();

            if (rand < 0.65) {
                let randomWidth = Math.random() > 0.5 ? 20 : 40;
                obstacles.push({
                    x: canvas.width,
                    y: 180,
                    width: randomWidth,
                    height: 38,
                    color: "#535353",
                    type: "cactus",
                    aiDecided: false,
                    shouldSucceed: true,
                    floating: false,
                    noDamage: false
                });
            } else {
                let isHigh = Math.random() > 0.5;
                let randomY = isHigh ? 120 : 150;
                obstacles.push({
                    x: canvas.width,
                    y: randomY,
                    width: 30,
                    height: 25,
                    color: "#535353",
                    type: isHigh ? "bird_high" : "bird_low",
                    aiDecided: false,
                    shouldSucceed: true,
                    floating: false,
                    noDamage: false
                });
            }
        }

        function spawnCloud() {
            clouds.push({
                x: canvas.width,
                y: Math.random() * 80 + 20,
                width: 40,
                height: 15,
                speed: Math.random() * 1 + 1
            });
        }

        function handleAI() {
            if (!isAFK || isGameOver || !isGameStarted) return;

            let targetObs = obstacles.find(obs => !obs.floating && obs.x + obs.width > dino.x);
            
            if (targetObs) {
                let distance = targetObs.x - (dino.x + dino.width);

                if (!targetObs.aiDecided && distance < (180 + gameSpeed * 5)) {
                    targetObs.aiDecided = true;
                    targetObs.shouldSucceed = Math.random() < 0.99; // 99% win, 1% fail rate
                }

                if (targetObs.aiDecided && targetObs.shouldSucceed) {
                    if (distance < (110 + gameSpeed * 3) && distance > 0 && dino.grounded) {
                        setDucking(false);
                        dino.vy = dino.jumpForce;
                        dino.grounded = false;
                    }
                }
            } else {
                setDucking(false);
            }
        }

        function createFireworks(x, y) {
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ffffff', '#ff9900'];
            for (let i = 0; i < 25; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 5 + 2;
                fireworks.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1,
                    size: Math.random() * 3 + 2
                });
            }
        }

        function triggerGameOver() {
            isGameOver = true;
            canRestart = false;
            if (score > highscore) highscore = Math.floor(score);

            setTimeout(() => {
                canRestart = true;
                if (isAFK) {
                    resetGame();
                }
            }, 500);
        }

        function update() {
            if (isGameOver || !isGameStarted) return;

            frameCount++;
            score += 0.05;

            // Speed increases by 1 for every 1000 points milestone reached
            let speedBonus = Math.floor(score / 1000);
            gameSpeed = baseSpeed + speedBonus;

            let now = Date.now();

            let targetInterval = boxIntervals[currentBoxCycle] * 1000;
            if (now - lastBoxTime >= targetInterval) {
                mysteryBoxes.push({
                    x: canvas.width,
                    y: 185,
                    width: 32,
                    height: 32
                });
                lastBoxTime = now;
                currentBoxCycle = (currentBoxCycle + 1) % boxIntervals.length;
            }

            handleAI();

            if (Math.floor(score) > 0 && Math.floor(score / 500) % 2 === 1) {
                canvas.classList.add("night");
            } else {
                canvas.classList.remove("night");
            }

            if (frameCount % 100 === 0) spawnCloud();

            // Handle R Skill
            if (levitateTimer > 0) {
                levitateTimer--;

                let floatCount = obstacles.filter(o => o.floating).length;
                for (let obs of obstacles) {
                    if (!obs.floating && floatCount < 13 && obs.x - dino.x < 240) {
                        makeObstacleGoogleSpace(obs);
                        floatCount++;
                    }
                }

                for (let obs of obstacles) {
                    if (obs.floating) {
                        obs.x += obs.vx;
                        obs.y += obs.vy;
                        obs.angle += obs.vRot;

                        if (obs.x < 10 || obs.x > canvas.width - obs.width - 10) {
                            obs.vx *= -1;
                        }
                        if (obs.y < 10 || obs.y > 180 - obs.height) {
                            obs.vy *= -1;
                        }
                    }
                }

                if (levitateTimer === 0) {
                    for (let i = obstacles.length - 1; i >= 0; i--) {
                        if (obstacles[i].floating) {
                            createFireworks(obstacles[i].x + obstacles[i].width / 2, obstacles[i].y + obstacles[i].height / 2);
                            obstacles.splice(i, 1);
                        }
                    }
                    spawnTimer = 60;
                }
            }

            spawnTimer--;
            if (spawnTimer <= 0) {
                spawnEntity();
                let minInterval = Math.max(40, 70 - Math.floor(gameSpeed * 2));
                let randomVar = Math.max(30, 60 - Math.floor(gameSpeed * 1.5));
                spawnTimer = Math.floor(Math.random() * randomVar) + minInterval; 
            }

            // Update Dino Dimensions dynamically based on Y Skill (1.5x scale)
            let scale = (dinoSizeTimer > 0) ? 1.5 : 1.0;
            dino.width = 40 * scale;
            dino.height = dino.ducking ? (25 * scale) : (43 * scale);

            // Dino Physics
            dino.vy += dino.gravity;
            dino.y += dino.vy;

            let groundY = 218 - dino.height;
            if (dino.y >= groundY) {
                dino.y = groundY;
                dino.vy = 0;
                dino.grounded = true;
            }

            for (let i = clouds.length - 1; i >= 0; i--) {
                clouds[i].x -= clouds[i].speed;
                if (clouds[i].x + clouds[i].width < 0) clouds.splice(i, 1);
            }

            for (let i = mysteryBoxes.length - 1; i >= 0; i--) {
                mysteryBoxes[i].x -= gameSpeed;

                if (
                    dino.x < mysteryBoxes[i].x + mysteryBoxes[i].width &&
                    dino.x + dino.width > mysteryBoxes[i].x &&
                    dino.y < mysteryBoxes[i].y + mysteryBoxes[i].height &&
                    dino.y + dino.height > mysteryBoxes[i].y
                ) {
                    score += 1000;

                    thousandEffects.push({
                        x: dino.x + 20, 
                        y: dino.y - 35,
                        timer: 180 
                    });

                    mysteryBoxes.splice(i, 1);
                    continue;
                }

                if (mysteryBoxes[i].x + mysteryBoxes[i].width < 0) {
                    mysteryBoxes.splice(i, 1);
                }
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];

                if (!obs.floating) {
                    obs.x -= gameSpeed;
                }

                let hitPadding = 5; 
                if (!obs.noDamage && !obs.floating) {
                    if (
                        dino.x + hitPadding < obs.x + obs.width &&
                        dino.x + dino.width - hitPadding > obs.x &&
                        dino.y + hitPadding < obs.y + obs.height &&
                        dino.y + dino.height - hitPadding > obs.y
                    ) {
                        triggerGameOver();
                    }
                }

                if (obs.x + obs.width < -100) {
                    obstacles.splice(i, 1);
                }
            }

            // Timers Update
            if (dinoRainbowTimer > 0) dinoRainbowTimer--;
            if (dinoSizeTimer > 0) dinoSizeTimer--;

            // Blinking logic updates
            if (blinkCounter > 0) {
                blinkFrame++;
                if (blinkFrame >= 8) { 
                    blinkCounter--;
                    blinkFrame = 0;
                }
            }

            for (let i = fireworks.length - 1; i >= 0; i--) {
                let p = fireworks[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.08;
                p.alpha -= 0.02;
                if (p.alpha <= 0) {
                    fireworks.splice(i, 1);
                }
            }

            if (activeBonusText) {
                activeBonusText.timer--;
                activeBonusText.y -= 0.3;
                if (activeBonusText.timer <= 0) activeBonusText = null;
            }

            for (let i = thousandEffects.length - 1; i >= 0; i--) {
                thousandEffects[i].timer--;
                thousandEffects[i].y -= 0.25;
                if (thousandEffects[i].timer <= 0) thousandEffects.splice(i, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#e0e0e0";
            for (let cloud of clouds) {
                ctx.fillRect(cloud.x, cloud.y, cloud.width, cloud.height);
            }

            ctx.strokeStyle = "#535353";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 218);
            ctx.lineTo(canvas.width, 218);
            ctx.stroke();

            for (let box of mysteryBoxes) {
                ctx.save();
                let hue = (frameCount * 10) % 360;
                ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
                ctx.fillRect(box.x, box.y, box.width, box.height);

                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 2;
                ctx.strokeRect(box.x, box.y, box.width, box.height);

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 20px 'Courier New'";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("?", box.x + 16, box.y + 16);
                ctx.restore();
            }

            // Draw Dino
            let isFlashing = blinkCounter > 0 && blinkCounter % 2 !== 0; 
            
            if (!isFlashing) {
                if (dinoRainbowTimer > 0) {
                    let hue = (frameCount * 15) % 360;
                    ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
                } else {
                    ctx.fillStyle = "#535353";
                }
                ctx.fillRect(dino.x, dino.y, dino.width, dino.height);
            }

            for (let obs of obstacles) {
                ctx.save();
                if (obs.floating && obs.angle !== undefined) {
                    ctx.translate(obs.x + obs.width / 2, obs.y + obs.height / 2);
                    ctx.rotate(obs.angle);
                    ctx.fillStyle = obs.color;
                    ctx.fillRect(-obs.width / 2, -obs.height / 2, obs.width, obs.height);
                } else {
                    ctx.fillStyle = obs.color;
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                }
                ctx.restore();
            }

            for (let p of fireworks) {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            for (let eff of thousandEffects) {
                ctx.save();
                let angle = Math.sin(frameCount * (Math.PI / 60)) * 0.25; 
                ctx.translate(eff.x, eff.y);
                ctx.rotate(angle);
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                let isBlack = Math.floor(eff.timer / 6) % 2 === 0;
                ctx.fillStyle = isBlack ? "#000000" : "#ffffff";
                ctx.strokeStyle = isBlack ? "#ffffff" : "#000000";
                ctx.lineWidth = 4;
                ctx.font = "bold 32px 'Courier New'";

                let alpha = eff.timer > 40 ? 1 : eff.timer / 40;
                ctx.globalAlpha = alpha;

                ctx.strokeText("+1000", 0, 0);
                ctx.fillText("+1000", 0, 0);
                ctx.restore();
            }

            for (let i = subTextEffects.length - 1; i >= 0; i--) {
                let eff = subTextEffects[i];
                eff.timer--;
                eff.y -= 0.3;

                ctx.save();
                let hue = (frameCount * 12) % 360; 
                ctx.fillStyle = `hsl(${hue}, 100%, 50%)`; 
                ctx.font = "bold 26px 'Courier New'";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                
                let alpha = eff.timer > 30 ? 1 : eff.timer / 30;
                ctx.globalAlpha = alpha;
                
                ctx.fillText("+1 sub", eff.x, eff.y);
                ctx.restore();

                if (eff.timer <= 0) subTextEffects.splice(i, 1);
            }

            if (activeBonusText) {
                ctx.save();
                let hue = (frameCount * 12) % 360; 
                ctx.fillStyle = `hsl(${hue}, 100%, 50%)`; 
                ctx.font = "bold 26px 'Courier New'";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                
                let alpha = activeBonusText.timer > 30 ? 1 : activeBonusText.timer / 30;
                ctx.globalAlpha = alpha;
                
                ctx.fillText("+" + activeBonusText.amount, activeBonusText.x, activeBonusText.y);
                ctx.restore();
            }

            ctx.fillStyle = "#535353";
            ctx.font = "bold 18px 'Courier New'";
            ctx.textAlign = "left";
            ctx.textBaseline = "alphabetic";
            let scoreStr = Math.floor(score).toString().padStart(5, '0');
            let hiStr = "HI " + Math.floor(highscore).toString().padStart(5, '0');
            ctx.fillText(hiStr + "  " + scoreStr, canvas.width - 220, 30);

            if (!isGameStarted) {
                ctx.fillStyle = "#535353";
                ctx.font = "18px 'Courier New'";
                ctx.fillText("Press SPACE or [↑] to Start", canvas.width / 2 - 150, canvas.height / 2);
            }

            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = "#535353";
                ctx.font = "bold 24px 'Courier New'";
                ctx.fillText("G A M E   O V E R", canvas.width / 2 - 120, canvas.height / 2 - 10);
                
                ctx.font = "16px 'Courier New'";
                if (canRestart) {
                    ctx.fillText("Press SPACE to Restart", canvas.width / 2 - 110, canvas.height / 2 + 25);
                } else {
                    ctx.fillStyle = "#888888";
                    ctx.fillText("Please wait (0.5s)...", canvas.width / 2 - 100, canvas.height / 2 + 25);
                }
            }
        }

        function loop() {
            update();
            draw();
            if (!isGameOver) {
                requestAnimationFrame(loop);
            }
        }

        draw();
    </script>
</body>
</html>
